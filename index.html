  }

  }
  .stat-label {

  .stat.correct .stat-num { color: #4caf50; }

  .questions { padding: 22px; }

    gap: 10px;
    margin-bottom: 12px;

    height: 32px;

    font-size: 11px;
    font-weight: 600;

    margin-bottom: 14px;
    color: #222;
  }

    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;

    text-align: left;
    width: 100%;
    font-family: inherit;
    color: #333;

    background: #f3f8ff;

  .option:disabled { cursor: not-allowed; }

    height: 26px;

    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;

    background: #ffebee;

    color: #fff;

    background: #fff8e1;
    border-left: 4px solid #ffc107;
    border-radius: 4px;
    display: none;

  }

    font-weight: 700;
    color: #f57c00;
    margin-bottom: 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;

    color: #444;

    padding: 18px 25px 26px;
    text-align: center;
    border-top: 1px solid #e0e0e0;
    background: #fafafa;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;

  .btn {
    background: #1976d2;

    border: none;
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;

    padding: 14px;
    color: #999;
    font-size: 12px;
    background: #f5f7fa;
  }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #999;
    display: none;
  }
  .empty.show { display: block; }

    header h1 { font-size: 20px; }
    .q-text { font-size: 14px; }
    .option { font-size: 13px; padding: 10px 12px; }
    .filter-btn { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>

const state = {
  answered: new Set(),
  correctSet: new Set(),
  incorrectSet: new Set(),
  filter: 'all'
};

const letters = ['A', 'B', 'C', 'D'];

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  questions.forEach((q, qIdx) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.id = `q${qIdx}`;
    qDiv.dataset.category = q.category;

    const optionsHTML = q.options.map((opt, oIdx) => `
      <button class="option" data-q="${qIdx}" data-o="${oIdx}" onclick="selectAnswer(${qIdx}, ${oIdx})">
        <span class="option-letter">${letters[oIdx]}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    qDiv.innerHTML = `
      <div class="q-header">
        <div class="q-num">${qIdx + 1}</div>
        <span class="q-category">${q.category}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <div class="options">${optionsHTML}</div>
      <div class="rationale" id="rationale-${qIdx}">
        <div class="rationale-label">💡 Rationale</div>
        <div class="rationale-text">${q.rationale}</div>
      </div>
    `;
    container.appendChild(qDiv);
  });
  applyFilter();
}

function selectAnswer(qIdx, oIdx) {
  if (state.answered.has(qIdx)) return;

  const q = questions[qIdx];
  const buttons = document.querySelectorAll(`.option[data-q="${qIdx}"]`);

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === q.correct) {
      btn.classList.add(idx === oIdx ? 'correct' : 'disabled-correct');
    } else if (idx === oIdx) {
      btn.classList.add('incorrect');
    }
  });

  document.getElementById(`rationale-${qIdx}`).classList.add('show');

  state.answered.add(qIdx);
  if (oIdx === q.correct) state.correctSet.add(qIdx);
  else state.incorrectSet.add(qIdx);

  updateStats();
}

function updateStats() {
  // Count only visible (filtered) questions for stats
  const visibleIndexes = questions
    .map((q, i) => ({ q, i }))
    .filter(({ q }) => state.filter === 'all' || q.category === state.filter)
    .map(({ i }) => i);

  const total = visibleIndexes.length;
  const answered = visibleIndexes.filter(i => state.answered.has(i)).length;
  const correct = visibleIndexes.filter(i => state.correctSet.has(i)).length;
  const incorrect = visibleIndexes.filter(i => state.incorrectSet.has(i)).length;

  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('incorrectCount').textContent = incorrect;
  document.getElementById('totalDisplay').textContent = total;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
  document.getElementById('scorePct').textContent = answered > 0
    ? `${Math.round((correct / answered) * 100)}%`
    : '—';
}

function filterQuestions(category) {
  state.filter = category;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === category);
  });
  applyFilter();
  updateStats();
  scrollToTop();
}

function applyFilter() {
  const cards = document.querySelectorAll('.question');
  let anyVisible = false;
  cards.forEach(card => {
    const show = state.filter === 'all' || card.dataset.category === state.filter;
    card.classList.toggle('hidden', !show);
    if (show) anyVisible = true;
  });
  document.getElementById('emptyState').classList.toggle('show', !anyVisible);
}

function resetExam() {
  if (!confirm('Reset all answers and start over?')) return;
  state.answered.clear();
  state.correctSet.clear();
  state.incorrectSet.clear();
  renderQuestions();
  updateStats();
  scrollToTop();
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuestions();
updateStats();
</script>
